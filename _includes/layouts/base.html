<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
</head>

<body>

    {{ content | safe }}
    <hr>
    <h3>Backlinks</h3>
    <ul>
        {% for link in backlinks %}
        <li>
            <a href="{{ link.url }}">{{ link.url }}</a>
        </li>
        {% endfor %}
    </ul>
</body>

</html>
