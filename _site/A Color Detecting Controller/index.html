<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=2.0" />
    <title>ECT</title>
    <link rel="stylesheet" href="/css/base.css">

</head>

<body>

    <div id="mainContainer">
        <h1>Building a Color Detection Controller</h1>
<p>Builds on top of this pattern: <a href="/Color%20Detection%20in%20TD/">Color Detection in TD</a></p>
<p>Want to explore: <strong>A technique for using some kind of analogue color mixing as a control mechanism.</strong></p>

        <hr>
        <h3>Backlinks</h3>
        <ul>
            
            <li>
                <a href="/Design Class Documentation/">/Design Class Documentation/</a>
            </li>
            
            <li>
                <a href="/Color Detection in TD/">/Color Detection in TD/</a>
            </li>
            
        </ul>
    </div>
    <script>
        const container = document.getElementById('mainContainer');

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY !== 0 ? e.deltaY : e.deltaX;
            container.scrollBy({ left: delta * 2, behavior: 'smooth' });
        }, { passive: false });

    </script>
</body>

</html>
