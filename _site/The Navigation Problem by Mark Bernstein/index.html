<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=2.0" />
    <title>ECT</title>
    <link rel="stylesheet" href="/css/base.css">

</head>

<body>

    <div id="mainContainer">
        <p><a href="https://www.eastgate.com/garden/NavTech.html">The Navigation Problem</a> shortly explained in his Hypertext Garden</p>

        <hr>
        <h3>Backlinks</h3>
        <ul>
            
            <li>
                <a href="/Talk with Carl about Navigation Interfaces/">/Talk with Carl about Navigation Interfaces/</a>
            </li>
            
            <li>
                <a href="/Design Class Documentation/">/Design Class Documentation/</a>
            </li>
            
        </ul>
    </div>
    <script>
        const container = document.getElementById('mainContainer');

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY !== 0 ? e.deltaY : e.deltaX;
            container.scrollBy({ left: delta * 2, behavior: 'smooth' });
        }, { passive: false });

    </script>
</body>

</html>
