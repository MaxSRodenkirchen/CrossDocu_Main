    <script>
        const container = document.getElementById('mainContainer');

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY !== 0 ? e.deltaY : e.deltaX;
            container.scrollBy({ left: delta * 2, behavior: 'smooth' });
        }, { passive: false });

    </script>
