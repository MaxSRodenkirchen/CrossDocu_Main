<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=2.0" />
    <title>ECT</title>
    <link rel="stylesheet" href="/css/base.css">

</head>

<body>

    <div id="mainContainer">
        <h1>How to Read a Book</h1>
<p>Part of the CrossDocu tool. <a href="/The%20idea%20behind%20CrossDocu/">The idea behind CrossDocu</a></p>

        <hr>
        <h3>Backlinks</h3>
        <ul>
            
            <li>
                <a href="/Design Class Documentation/">/Design Class Documentation/</a>
            </li>
            
        </ul>
    </div>
    <script>
        const container = document.getElementById('mainContainer');

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY !== 0 ? e.deltaY : e.deltaX;
            container.scrollBy({ left: delta * 2, behavior: 'smooth' });
        }, { passive: false });

    </script>
</body>

</html>
